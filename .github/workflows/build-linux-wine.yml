      - name: Add Ero Wine diagnostics
        shell: powershell
        run: |
          $file = "Ero gameserver/dllmain.cpp"
          $content = Get-Content $file -Raw

          # -------------------------------------------------------
          # Debug logger -> directly visible from Fedora
          # -------------------------------------------------------

          if (-not $content.Contains("static void EroDbg(")) {

              $needle = '#pragma comment(lib, "minhook/minhook.lib")'

              if (-not $content.Contains($needle)) {
                  throw "MinHook pragma not found"
              }

              $helper = @'

          static void EroDbg(const char* msg)
          {
              FILE* f = nullptr;

              fopen_s(
                  &f,
                  R"(Z:\home\flopinou\Games\OGFN\tools\ero-host\ero-debug.log)",
                  "a"
              );

              if (f)
              {
                  fprintf(f, "%s\n", msg);
                  fflush(f);
                  fclose(f);
              }
          }

          '@

              $content = $content.Replace(
                  $needle,
                  $needle + $helper
              )
          }

          # -------------------------------------------------------
          # Start of InitThread
          # -------------------------------------------------------

          $content = $content.Replace(
              '    AllocConsole();',
              '    EroDbg("01 InitThread entered");' + "`r`n" +
              '    AllocConsole();'
          )

          $content = $content.Replace(
              '    MH_Initialize();',
              '    EroDbg("02 before MH_Initialize");' + "`r`n" +
              '    MH_Initialize();' + "`r`n" +
              '    EroDbg("03 after MH_Initialize");'
          )

          $content = $content.Replace(
              '    InitGObjects();',
              '    EroDbg("04 before InitGObjects");' + "`r`n" +
              '    InitGObjects();' + "`r`n" +
              '    EroDbg("05 after InitGObjects");'
          )

          # -------------------------------------------------------
          # Guard GetEngine() - first dangerous dereference in Ero
          # -------------------------------------------------------

          $oldEngine = '    LPVOID GetMaxTickRateAddrOK = (LPVOID)((*(void***)GetEngine())[86]);'

          if (-not $content.Contains($oldEngine)) {
              throw "GetEngine line not found"
          }

          $newEngine = @'
              EroDbg("06 before GetEngine");

              auto EngineForTickRate = GetEngine();

              if (!EngineForTickRate)
              {
                  EroDbg("FAIL: GetEngine returned NULL");
                  return 0;
              }

              EroDbg("07 GetEngine OK");

              auto EngineVTable = *(void***)EngineForTickRate;

              if (!EngineVTable)
              {
                  EroDbg("FAIL: Engine VTable is NULL");
                  return 0;
              }

              EroDbg("08 Engine VTable OK");

              LPVOID GetMaxTickRateAddrOK = (LPVOID)EngineVTable[86];
          '@

          $content = $content.Replace(
              $oldEngine,
              $newEngine
          )

          # -------------------------------------------------------
          # Guard Athena PlayerController default object
          # -------------------------------------------------------

          $oldReady = '    LPVOID ServerReadyToStartMatchAddr = (LPVOID)((*(void***)AAthena_PlayerController_C::StaticClass()->DefaultObject)[0x269]);'
          $oldLoading = '    LPVOID ServerLoadingScreenDroppedAddr = (LPVOID)((*(void***)AAthena_PlayerController_C::StaticClass()->DefaultObject)[0x26B]);'

          if (-not $content.Contains($oldReady)) {
              throw "ServerReadyToStartMatch line not found"
          }

          if (-not $content.Contains($oldLoading)) {
              throw "ServerLoadingScreenDropped line not found"
          }

          $newReady = @'
              EroDbg("09 before Athena PlayerController StaticClass");

              auto AthenaPCClass =
                  AAthena_PlayerController_C::StaticClass();

              if (!AthenaPCClass)
              {
                  EroDbg("FAIL: Athena PlayerController StaticClass NULL");
                  return 0;
              }

              auto AthenaPCDefault = AthenaPCClass->DefaultObject;

              if (!AthenaPCDefault)
              {
                  EroDbg("FAIL: Athena PlayerController DefaultObject NULL");
                  return 0;
              }

              auto AthenaPCVTable = *(void***)AthenaPCDefault;

              if (!AthenaPCVTable)
              {
                  EroDbg("FAIL: Athena PlayerController VTable NULL");
                  return 0;
              }

              EroDbg("10 Athena PlayerController OK");

              LPVOID ServerReadyToStartMatchAddr =
                  (LPVOID)AthenaPCVTable[0x269];

              LPVOID ServerLoadingScreenDroppedAddr =
                  (LPVOID)AthenaPCVTable[0x26B];
          '@

          $content = $content.Replace(
              $oldReady,
              $newReady
          )

          $content = $content.Replace(
              $oldLoading,
              ''
          )

          # -------------------------------------------------------
          # Guard initial PlayerPawn swaps
          # -------------------------------------------------------

          $oldPawn1 = '    SwapVTable(APlayerPawn_Athena_C::StaticClass()->DefaultObject, 0x1EA, ServerHandlePickup, (void**)&ServerHandlePickupOG);'
          $oldPawn2 = '    SwapVTable(APlayerPawn_Athena_C::StaticClass()->DefaultObject, 0x1E6, ServerHandlePickupWithSwap);'
          $oldPawn3 = '    SwapVTable(APlayerPawn_Athena_C::StaticClass()->DefaultObject, 0x1E8, ServerHandlePickupWithSwap);'

          if (-not $content.Contains($oldPawn1)) {
              throw "Initial PlayerPawn hook not found"
          }

          $newPawn1 = @'
              EroDbg("11 before PlayerPawn StaticClass");

              auto PlayerPawnClass =
                  APlayerPawn_Athena_C::StaticClass();

              if (!PlayerPawnClass)
              {
                  EroDbg("FAIL: PlayerPawn StaticClass NULL");
                  return 0;
              }

              auto PlayerPawnDefault =
                  PlayerPawnClass->DefaultObject;

              if (!PlayerPawnDefault)
              {
                  EroDbg("FAIL: PlayerPawn DefaultObject NULL");
                  return 0;
              }

              EroDbg("12 PlayerPawn DefaultObject OK");

              SwapVTable(
                  PlayerPawnDefault,
                  0x1EA,
                  ServerHandlePickup,
                  (void**)&ServerHandlePickupOG
              );
          '@

          $content = $content.Replace(
              $oldPawn1,
              $newPawn1
          )

          $content = $content.Replace(
              $oldPawn2,
              '    SwapVTable(PlayerPawnDefault, 0x1E6, ServerHandlePickupWithSwap);'
          )

          $content = $content.Replace(
              $oldPawn3,
              '    SwapVTable(PlayerPawnDefault, 0x1E8, ServerHandlePickupWithSwap);' +
              "`r`n" +
              '    EroDbg("13 initial PlayerPawn hooks OK");'
          )

          # -------------------------------------------------------
          # Broad progress markers
          # -------------------------------------------------------

          $content = $content.Replace(
              '    SpecName = Conv_StringToName(TEXT("Spectating"));',
              '    EroDbg("14 GObjects loops completed");' + "`r`n" +
              '    SpecName = Conv_StringToName(TEXT("Spectating"));'
          )

          $content = $content.Replace(
              '    MH_CreateHook(PEAddr, ProcessEventHook, (void**)&ProcessEventOG);',
              '    EroDbg("15 loadouts completed - starting MinHook hooks");' +
              "`r`n" +
              '    MH_CreateHook(PEAddr, ProcessEventHook, (void**)&ProcessEventOG);'
          )

          $content = $content.Replace(
              '    cout << BaseAddr << endl;',
              '    EroDbg("16 first MinHook block completed");' + "`r`n" +
              '    cout << BaseAddr << endl;'
          )

          $content = $content.Replace(
              '    UFortAbilitySystemComponentAthena* DefObj =',
              '    EroDbg("17 late VTable/MinHook block completed");' +
              "`r`n" +
              '    UFortAbilitySystemComponentAthena* DefObj ='
          )

          $content = $content.Replace(
              '    ((UGameplayStatics*)UGameplayStatics::StaticClass()->DefaultObject)->OpenLevel',
              '    EroDbg("18 ability hooks completed - before OpenLevel");' +
              "`r`n" +
              '    ((UGameplayStatics*)UGameplayStatics::StaticClass()->DefaultObject)->OpenLevel'
          )

          # -------------------------------------------------------
          # Protect final GetEngine() too
          # -------------------------------------------------------

          $oldFinal = '    GetEngine()->GameInstance->LocalPlayers.FreeArray();'

          if ($content.Contains($oldFinal)) {

              $newFinal = @'
              EroDbg("19 OpenLevel completed");

              auto FinalEngine = GetEngine();

              if (!FinalEngine)
              {
                  EroDbg("FAIL: Final GetEngine NULL");
                  return 0;
              }

              if (!FinalEngine->GameInstance)
              {
                  EroDbg("FAIL: GameInstance NULL");
                  return 0;
              }

              FinalEngine->GameInstance->LocalPlayers.FreeArray();

              EroDbg("20 Ero initialization completed");
          '@

              $content = $content.Replace(
                  $oldFinal,
                  $newFinal
              )
          }

          Set-Content -Path $file -Value $content -Encoding UTF8

          Write-Host "=== Ero diagnostic patch installed ==="

          Select-String `
            -Path $file `
            -Pattern 'EroDbg|FAIL:'
