name: Build FN.AutoHost Wine Tellurium

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # PATCH PROGRAM.CS
      # - Ignore le système Settings.Default qui bloque sous Wine
      # - Utilise directement notre chemin Fortnite 12.41
      # ---------------------------------------------------------
      - name: Patch Program.cs for Wine
        shell: powershell
        run: |
          $file = "FN.AutoHost/Program.cs"
          $content = Get-Content $file -Raw

          $oldFirst = 'if (!Settings.Default.first)'
          $oldLaunch = 'Fortnite.Launch(Settings.Default.path);'

          if (-not $content.Contains($oldFirst)) {
              throw "Could not find first-run check in Program.cs"
          }

          if (-not $content.Contains($oldLaunch)) {
              throw "Could not find Fortnite.Launch in Program.cs"
          }

          $content = $content.Replace(
              $oldFirst,
              'if (false)'
          )

          $content = $content.Replace(
              $oldLaunch,
              'Fortnite.Launch(@"Z:\home\flopinou\Games\OGFN\builds\12.41");'
          )

          Set-Content -Path $file -Value $content -Encoding UTF8

          Write-Host "=== Program.cs patched ==="

          Select-String `
            -Path $file `
            -Pattern 'if \(false\)|Fortnite\.Launch'

      # ---------------------------------------------------------
      # PATCH FORTNITE.CS
      #
      # Original:
      #   proc.Start()
      #   -> inject Cobalt/Redirect
      #   -> wait stdout "Region "
      #   -> inject Gameserver
      #
      # Wine version:
      #   proc.Start()
      #   -> inject Tellurium immediately
      #   -> wait 10 seconds
      #   -> inject Ero
      #
      # This avoids Cobalt entirely.
      # ---------------------------------------------------------
      - name: Patch Fortnite.cs for Tellurium
        shell: powershell
        run: |
          $file = "FN.AutoHost/Fortnite.cs"
          $content = Get-Content $file -Raw

          $startMarker = 'proc.Start();'
          $endMarker = '// Interval for Checking if FortniteClient-Win64-Shipping Closed.'

          $startPos = $content.IndexOf($startMarker)

          if ($startPos -lt 0) {
              throw "proc.Start() not found in Fortnite.cs"
          }

          $endPos = $content.IndexOf($endMarker, $startPos)

          if ($endPos -lt 0) {
              throw "Interval marker not found in Fortnite.cs"
          }

          # Start from beginning of proc.Start() line
          $lineStart = $content.LastIndexOf("`n", $startPos)

          if ($lineStart -lt 0) {
              $lineStart = 0
          }
          else {
              $lineStart++
          }

          # Start from beginning of marker line
          $markerLineStart = $content.LastIndexOf("`n", $endPos)

          if ($markerLineStart -lt 0) {
              $markerLineStart = $endPos
          }
          else {
              $markerLineStart++
          }

          $replacement = @'
                  proc.Start();

                  Console.ForegroundColor = ConsoleColor.Cyan;
                  Console.WriteLine("[+] Fortnite started, PID: " + proc.Id);

                  // Tellurium replaces Cobalt.
                  // Inject Tellurium early so Epic/backend requests are redirected.
                  Console.WriteLine("[+] Injecting Redirect.dll (Tellurium)...");

                  Inject(
                      proc.Id,
                      Directory.GetCurrentDirectory() + "\\Redirect.dll"
                  );

                  Console.ForegroundColor = ConsoleColor.Yellow;
                  Console.WriteLine("[+] Tellurium injected");

                  // We already confirmed that Fortnite + Tellurium are stable.
                  // Keep a short delay to avoid injecting Ero immediately at process start.
                  Console.WriteLine("[+] Waiting 10 seconds before Gameserver injection...");

                  Thread.Sleep(10000);

                  if (proc.HasExited)
                  {
                      Console.ForegroundColor = ConsoleColor.Red;
                      Console.WriteLine("[!] Fortnite exited BEFORE Gameserver injection");
                      goto start;
                  }

                  Console.ForegroundColor = ConsoleColor.Cyan;
                  Console.WriteLine(
                      "[+] Injecting Gameserver DLL: " +
                      data["Settings"]["GameServerDllName"]
                  );

                  Inject(
                      proc.Id,
                      Directory.GetCurrentDirectory() +
                      "\\" +
                      data["Settings"]["GameServerDllName"]
                  );

                  bGameserver = true;

                  Console.ForegroundColor = ConsoleColor.Green;
                  Console.WriteLine("[+] Gameserver DLL injected");

          '@

          $before = $content.Substring(0, $lineStart)
          $after = $content.Substring($markerLineStart)

          $content = $before + $replacement + $after

          # Disable the ORIGINAL Cobalt Region-triggered injection.
          # Otherwise Ero could be injected a second time if stdout
          # happens to contain a Region line.
          $oldRegion = 'if (output.Contains("Region "))'
          $newRegion = 'if (false && output.Contains("Region "))'

          if (-not $content.Contains($oldRegion)) {
              throw "Original Region check not found"
          }

          $content = $content.Replace(
              $oldRegion,
              $newRegion
          )

          # Reset state whenever AutoHost restarts Fortnite.
          $oldStart = @'
              start:
          '@

          $newStart = @'
              start:
                  bGameserver = false;
          '@

          if (-not $content.Contains($oldStart)) {
              Write-Host "WARNING: start label formatting differs; continuing without reset patch"
          }
          else {
              $content = $content.Replace(
                  $oldStart,
                  $newStart
              )
          }

          Set-Content -Path $file -Value $content -Encoding UTF8

          Write-Host ""
          Write-Host "=== Fortnite.cs patched ==="

          Select-String `
            -Path $file `
            -Pattern `
              'Tellurium|Waiting 10 seconds|Gameserver DLL injected|false && output.Contains|bGameserver = false'

      # ---------------------------------------------------------
      # SHOW PATCHED CODE
      # Helpful if the build fails again.
      # ---------------------------------------------------------
      - name: Show patched Fortnite section
        shell: powershell
        run: |
          $file = "FN.AutoHost/Fortnite.cs"

          $lines = Get-Content $file

          for ($i = 80; $i -lt [Math]::Min(170, $lines.Count); $i++) {
              Write-Host "$($i + 1): $($lines[$i])"
          }

      # ---------------------------------------------------------
      # BUILD
      # ---------------------------------------------------------
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore FN.AutoHost.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        run: |
          msbuild FN.AutoHost.sln /m /p:Configuration=Release

      # ---------------------------------------------------------
      # SHOW OUTPUT
      # ---------------------------------------------------------
      - name: Find build output
        shell: powershell
        run: |
          Write-Host "=== Release files ==="

          Get-ChildItem "FN.AutoHost/bin/Release" -Recurse |
            Select-Object FullName, Length

      # ---------------------------------------------------------
      # UPLOAD
      # ---------------------------------------------------------
      - name: Upload FN.AutoHost
        uses: actions/upload-artifact@v4
        with:
          name: FN-AutoHost-Wine-Tellurium-10s
          path: |
            FN.AutoHost/bin/Release/*
          if-no-files-found: error
